name: Build and Publish Image

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm exec jest --runInBand

      - name: Build application
        run: pnpm run build

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git

      - name: Lint Helm chart
        run: helm lint deploy/furfriend-finder

      - name: Render Helm chart
        run: helm template furfriend-finder deploy/furfriend-finder --values deploy/furfriend-finder/values-production.yaml

      - name: Run Helm unit tests
        run: helm unittest deploy/furfriend-finder

  image:
    name: Build and publish GHCR image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[skip image]')
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/furfriend-finder
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  update-gitops:
    name: Update GitOps image tag
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[skip image]')
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/furfriend-finder
      IMAGE_TAG: ${{ github.sha }}
      VALUES_FILE: deploy/furfriend-finder/values-production.yaml
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Update production values
        run: |
          perl -0pi -e "s#(?ms)^image:\n  repository: .*\n  tag: .*#image:\n  repository: ${IMAGE_NAME}\n  tag: ${IMAGE_TAG}#" "$VALUES_FILE"
          git diff -- "$VALUES_FILE"

      - name: Commit GitOps value update
        run: |
          if git diff --quiet -- "$VALUES_FILE"; then
            echo "GitOps values already point at ${IMAGE_TAG}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$VALUES_FILE"
          git commit -m "chore(deploy): update image tag to ${IMAGE_TAG} [skip image]"
          git push
