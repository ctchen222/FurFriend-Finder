name: Build and Deploy Dev Image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  image:
    name: Build and publish immutable dev image
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_repository: ${{ steps.image.outputs.repository }}
      image_digest: ${{ steps.build.outputs.digest }}
    env:
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/furfriend-finder
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Normalize image repository
        id: image
        shell: bash
        run: |
          normalized="${IMAGE_REPOSITORY,,}"
          echo "repository=$normalized" >> "$GITHUB_OUTPUT"
          echo "IMAGE_REPOSITORY=$normalized" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ github.event.workflow_run.head_sha }}
          outputs: type=registry
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy dev Compose stack
    needs: [image]
    if: needs.image.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://dev.furfriend-finder.com
    env:
      IMAGE_REPOSITORY: ${{ needs.image.outputs.image_repository }}
      IMAGE_DIGEST: ${{ needs.image.outputs.image_digest }}
      DEPLOY_HOST: ${{ secrets.DEV_DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEV_DEPLOY_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
    steps:
      - name: Validate deployment inputs
        shell: bash
        run: |
          [[ "$IMAGE_REPOSITORY" =~ ^ghcr\.io/[a-z0-9_.-]+/furfriend-finder$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"

      - name: Install SSH credentials
        shell: bash
        run: |
          install -m 700 -d "$RUNNER_TEMP/ssh"
          install -m 600 /dev/null "$RUNNER_TEMP/ssh/deploy_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/deploy_key"
          install -m 600 /dev/null "$RUNNER_TEMP/ssh/known_hosts"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"

      - name: Deploy immutable digest
        shell: bash
        run: >-
          ssh
          -i "$RUNNER_TEMP/ssh/deploy_key"
          -o IdentitiesOnly=yes
          -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts"
          "$DEPLOY_USER@$DEPLOY_HOST"
          "sudo /usr/local/sbin/furfriend-deploy dev '$IMAGE_DIGEST'"
