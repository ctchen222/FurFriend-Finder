name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      helm: ${{ steps.filter.outputs.helm }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'src/**'
              - 'package.json'
              - 'tsconfig.json'
              - 'pnpm-lock.yaml'
              - 'eslint.config.js'
              - '.github/actions/**'
            helm:
              - 'deploy/furfriend-finder/**'

  lint:
    name: Lint
    needs: [changes]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Run lint
        run: pnpm lint

  type-check:
    name: Type check
    needs: [changes]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Run type check
        run: pnpm type-check

  build:
    name: Build
    needs: [changes, type-check]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Build application
        run: pnpm run build

  test-unit:
    name: Unit tests
    needs: [changes, lint, type-check]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Run unit tests
        run: pnpm test:unit

  test-integration:
    name: Integration tests
    needs: [changes, test-unit]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Run integration tests
        run: pnpm test:integration

  helm-validate:
    name: Helm validate
    needs: [changes]
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.5

      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git

      - name: Lint Helm chart
        run: helm lint deploy/furfriend-finder

      - name: Render Helm chart
        run: helm template furfriend-finder deploy/furfriend-finder --values deploy/furfriend-finder/values-production.yaml

      - name: Run Helm unit tests
        run: helm unittest deploy/furfriend-finder

  status-gate:
    name: CI status gate
    runs-on: ubuntu-latest
    needs: [changes, lint, type-check, build, test-unit, test-integration, helm-validate]
    if: always()
    steps:
      - name: Evaluate job results
        run: |
          failed=false
          while IFS='=' read -r name result; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "FAIL: $name → $result"
              failed=true
            else
              echo "OK:   $name → $result"
            fi
          done <<EOF
          changes=${{ needs.changes.result }}
          lint=${{ needs.lint.result }}
          type-check=${{ needs.type-check.result }}
          build=${{ needs.build.result }}
          test-unit=${{ needs.test-unit.result }}
          test-integration=${{ needs.test-integration.result }}
          helm-validate=${{ needs.helm-validate.result }}
          EOF
          if [[ "$failed" == "true" ]]; then
            exit 1
          fi
          echo "All checks passed or were skipped."
