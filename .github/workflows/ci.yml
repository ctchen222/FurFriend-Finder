name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      helm: ${{ steps.filter.outputs.helm }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'src/**'
              - 'web/**'
              - 'views/**'
              - 'sql/**'
              - 'tests/web-e2e/**'
              - 'playwright.web.config.ts'
              - '.github/workflows/ci.yml'
              - 'Dockerfile'
              - '.dockerignore'
              - 'package.json'
              - 'tsconfig.json'
              - 'pnpm-lock.yaml'
              - 'web/pnpm-lock.yaml'
              - 'eslint.config.js'
              - '.github/actions/**'
            helm:
              - 'deploy/furfriend-finder/**'
            deploy:
              - 'deploy/compose/**'
              - 'deploy/scripts/**'
              - 'deploy/runbooks/vps-docker-dev.md'
              - '.github/workflows/ci.yml'

  lint:
    name: Lint
    needs: [changes]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Run lint
        run: pnpm lint

  type-check:
    name: Type check
    needs: [changes]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Run type check
        run: pnpm type-check

  build:
    name: Build
    needs: [changes, type-check]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Build application
        run: pnpm run build

  web:
    name: React checks
    needs: [changes]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install React dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Lint React
        run: pnpm exec eslint web/src
      - name: Type check and build React
        run: pnpm build:web
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify controlled UI states
        run: pnpm test:web:e2e tests/web-e2e/states.spec.ts
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: react-browser-failures
          path: test-results/

  test-unit:
    name: Unit tests
    needs: [changes, lint, type-check]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Run unit tests
        run: pnpm test:unit

  test-integration:
    name: Integration tests
    needs: [changes, test-unit]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Run integration tests
        run: pnpm test:integration

  helm-validate:
    name: Helm validate
    needs: [changes]
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.5

      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git

      - name: Lint Helm chart
        run: helm lint deploy/furfriend-finder

      - name: Render Helm chart
        run: helm template furfriend-finder deploy/furfriend-finder --values deploy/furfriend-finder/values-production.yaml

      - name: Run Helm unit tests
        run: helm unittest deploy/furfriend-finder

  compose-validate:
    name: Docker Compose validation
    needs: [changes]
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare non-secret Compose environment
        shell: bash
        run: |
          cp deploy/compose/env.dev.example "$RUNNER_TEMP/dev.env"
          touch "$RUNNER_TEMP/dev.cloudflare-tunnel-token"

      - name: Validate Compose files
        env:
          APP_ENV_FILE: ${{ runner.temp }}/dev.env
          CLOUDFLARE_TUNNEL_TOKEN_FILE: ${{ runner.temp }}/dev.cloudflare-tunnel-token
        run: >-
          docker compose
          --env-file "$RUNNER_TEMP/dev.env"
          -f deploy/compose/compose.yaml
          -f deploy/compose/compose.dev.yaml
          config --quiet

  status-gate:
    name: CI status gate
    runs-on: ubuntu-latest
    needs:
      [
        changes,
        lint,
        type-check,
        build,
        web,
        test-unit,
        test-integration,
        helm-validate,
        compose-validate,
      ]
    if: always()
    steps:
      - name: Evaluate job results
        run: |
          failed=false
          while IFS='=' read -r name result; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "FAIL: $name → $result"
              failed=true
            else
              echo "OK:   $name → $result"
            fi
          done <<EOF
          changes=${{ needs.changes.result }}
          lint=${{ needs.lint.result }}
          type-check=${{ needs.type-check.result }}
          build=${{ needs.build.result }}
          web=${{ needs.web.result }}
          test-unit=${{ needs.test-unit.result }}
          test-integration=${{ needs.test-integration.result }}
          helm-validate=${{ needs.helm-validate.result }}
          compose-validate=${{ needs.compose-validate.result }}
          EOF
          if [[ "$failed" == "true" ]]; then
            exit 1
          fi
          echo "All checks passed or were skipped."

  image:
    name: Build and publish immutable dev image
    needs: [changes, status-gate]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev' &&
      needs['status-gate'].result == 'success' &&
      (needs.changes.outputs.app == 'true' || needs.changes.outputs.deploy == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_repository: ${{ steps.image.outputs.repository }}
      image_digest: ${{ steps.build.outputs.digest }}
    env:
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/furfriend-finder
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Normalize image repository
        id: image
        shell: bash
        run: |
          normalized="${IMAGE_REPOSITORY,,}"
          echo "repository=$normalized" >> "$GITHUB_OUTPUT"
          echo "IMAGE_REPOSITORY=$normalized" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          outputs: type=registry
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy dev Compose stack
    needs: [image]
    if: needs.image.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://dev.furfriend-finder.com
    env:
      IMAGE_REPOSITORY: ${{ needs.image.outputs.image_repository }}
      IMAGE_DIGEST: ${{ needs.image.outputs.image_digest }}
      DEPLOY_HOST: ${{ secrets.DEV_DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEV_DEPLOY_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
    steps:
      - name: Validate deployment inputs
        shell: bash
        run: |
          [[ "$IMAGE_REPOSITORY" =~ ^ghcr\.io/[a-z0-9_.-]+/furfriend-finder$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"

      - name: Install SSH credentials
        shell: bash
        run: |
          install -m 700 -d "$RUNNER_TEMP/ssh"
          install -m 600 /dev/null "$RUNNER_TEMP/ssh/deploy_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/deploy_key"
          install -m 600 /dev/null "$RUNNER_TEMP/ssh/known_hosts"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"

      - name: Deploy immutable digest
        shell: bash
        run: >-
          ssh
          -i "$RUNNER_TEMP/ssh/deploy_key"
          -o IdentitiesOnly=yes
          -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts"
          "$DEPLOY_USER@$DEPLOY_HOST"
          "sudo /usr/local/sbin/furfriend-deploy dev '$IMAGE_DIGEST'"

      - name: Verify public dev health
        run: >-
          curl --fail --silent --show-error
          --retry 6 --retry-delay 5 --retry-all-errors
          https://dev.furfriend-finder.com/health

      - name: Collect bounded deployment diagnostics
        if: failure()
        run: >-
          ssh
          -i "$RUNNER_TEMP/ssh/deploy_key"
          -o IdentitiesOnly=yes
          -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts"
          "$DEPLOY_USER@$DEPLOY_HOST"
          "sudo /usr/local/sbin/furfriend-status dev --logs 120"
