name: Setup Node and pnpm
description: Checkout repository, enable Corepack, set up Node.js, and install pnpm dependencies.

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
