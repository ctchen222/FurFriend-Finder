apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "observability-stack.grafana.name" . }}
  labels:
    {{- include "observability-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "observability-stack.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: grafana
  template:
    metadata:
      labels:
        {{- include "observability-stack.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: grafana
    spec:
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: "{{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag }}"
          imagePullPolicy: {{ .Values.grafana.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.grafana.adminSecret.name }}
                  key: {{ .Values.grafana.adminSecret.userKey }}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.grafana.adminSecret.name }}
                  key: {{ .Values.grafana.adminSecret.passwordKey }}
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            {{- with .Values.grafana.server }}
            - name: GF_SERVER_DOMAIN
              value: {{ .domain | quote }}
            - name: GF_SERVER_ROOT_URL
              value: {{ .rootUrl | quote }}
            - name: GF_SERVER_PROTOCOL
              value: {{ .protocol | quote }}
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: {{ .serveFromSubPath | quote }}
            {{- end }}
            {{- with .Values.grafana.live }}
            - name: GF_LIVE_ALLOWED_ORIGINS
              value: {{ .allowedOrigins | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards
              mountPath: /etc/grafana/provisioning/dashboards
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "observability-stack.grafana.name" . }}-data
        - name: datasources
          configMap:
            name: {{ include "observability-stack.grafana.name" . }}-datasources
        - name: dashboards
          configMap:
            name: {{ include "observability-stack.grafana.name" . }}-dashboards
