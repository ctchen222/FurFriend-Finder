apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: furfriend-finder
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ctchen222/FurFriend-Finder.git
    targetRevision: main
    path: deploy/furfriend-finder
    helm:
      valueFiles:
        - values-production.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: furfriend-finder
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
