apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-sops-cmp-plugin
  namespace: argocd
data:
  plugin.yaml: |
    apiVersion: argoproj.io/v1alpha1
    kind: ConfigManagementPlugin
    metadata:
      name: sops-secrets
    spec:
      version: v1.0
      discover:
        find:
          command:
            - sh
            - -c
            - file="$(find . -maxdepth 1 -name '*.sops.yaml' -print -quit)"; test -n "$file"; printf '%s\n' "$file"
      generate:
        command:
          - sh
          - -c
        args:
          - |
            set -eu
            find . -maxdepth 1 -name '*.plain.yaml' -print | sort | while IFS= read -r file; do
              cat "$file"
              printf '\n---\n'
            done
            find . -maxdepth 1 -name '*.sops.yaml' -print | sort | while IFS= read -r file; do
              sops --decrypt "$file"
              printf '\n---\n'
            done
