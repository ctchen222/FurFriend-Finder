apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: furfriend-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ctchen222/FurFriend-Finder.git
    targetRevision: main
    path: deploy/secrets
    plugin: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
