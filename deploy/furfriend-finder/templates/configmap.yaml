apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "furfriend-finder.fullname" . }}-config
  labels:
    {{- include "furfriend-finder.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.config.nodeEnv | quote }}
  PORT: {{ .Values.config.port | quote }}
  APP_BASE_URL: {{ .Values.config.appBaseUrl | quote }}
  FRONTEND_URL: {{ .Values.config.frontendUrl | quote }}
  EMAIL_VERIFY_CALLBACK_URL: {{ .Values.config.emailVerifyCallbackUrl | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
  OTEL_SDK_DISABLED: {{ .Values.config.telemetry.disabled | quote }}
  OTEL_SERVICE_NAME: {{ .Values.config.telemetry.serviceName | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.telemetry.otlpEndpoint | quote }}
