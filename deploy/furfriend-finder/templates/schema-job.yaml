{{- if .Values.schemaJob.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "furfriend-finder.fullname" . }}-schema
  labels:
    {{- include "furfriend-finder.labels" . | nindent 4 }}
    app.kubernetes.io/component: schema
spec:
  backoffLimit: {{ .Values.schemaJob.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "furfriend-finder.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: schema
    spec:
      restartPolicy: OnFailure
      containers:
        - name: schema
          image: "{{ .Values.schemaJob.image.repository }}:{{ .Values.schemaJob.image.tag }}"
          imagePullPolicy: {{ .Values.schemaJob.image.pullPolicy }}
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.secretName }}
                  key: {{ .Values.postgresql.passwordKey }}
          command:
            - /bin/sh
            - -ec
            - |
              until pg_isready -h {{ include "furfriend-finder.postgresql.fullname" . }} -U {{ .Values.postgresql.username | quote }} -d {{ .Values.postgresql.database | quote }}; do
                sleep 2
              done
              if psql -h {{ include "furfriend-finder.postgresql.fullname" . }} -U {{ .Values.postgresql.username | quote }} -d {{ .Values.postgresql.database | quote }} -tAc "SELECT 1 FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'user'" | grep -q 1; then
                echo "Schema already initialized."
                exit 0
              fi
              psql -v ON_ERROR_STOP=1 -h {{ include "furfriend-finder.postgresql.fullname" . }} -U {{ .Values.postgresql.username | quote }} -d {{ .Values.postgresql.database | quote }} -f /schema/V1__Initial.sql
          volumeMounts:
            - name: schema
              mountPath: /schema
      volumes:
        - name: schema
          configMap:
            name: {{ include "furfriend-finder.fullname" . }}-schema
{{- end -}}
